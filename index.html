<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>微软语音合成 - Azure TTS</title>
    <meta name="description" content="基于微软 Azure 认知服务的文本转语音工具，支持 63 种中文音色">
    <meta name="keywords" content="微软,Azure,语音合成,TTS,文本转语音,Azure认知服务,Neural TTS">
    <meta name="theme-color" content="#2563eb">
    <meta property="og:title" content="微软语音合成 - Azure TTS">
    <meta property="og:description" content="基于微软 Azure 认知服务的文本转语音工具">
    <link rel="icon" href="https://www.microsoft.com/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="header">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 10v3c0 3.771 0 5.657 1.172 6.828C4.343 21 6.229 21 10 21h4c3.771 0 5.657 0 6.828-1.172C22 18.657 22 16.771 22 13v-3c0-3.771 0-5.657-1.172-6.828C19.657 2 17.771 2 14 2h-4C6.229 2 4.343 2 3.172 3.172 2 4.343 2 6.229 2 10z"/>
            <circle cx="8" cy="12" r="2"/>
            <circle cx="16" cy="12" r="2"/>
            <path d="M8 12h8"/>
        </svg>
        <div class="header-text">
            <h1>微软语音合成</h1>
            <p class="header-sub">Azure Neural TTS · 63 种中文音色 · Dragon HD Omni</p>
        </div>
    </header>

    <main class="main">
        <div class="card input-card">
            <div class="voice-row">
                <label for="voiceName" class="label">选择音色</label>
                <div class="select-wrap">
                    <select id="voiceName"></select>
                </div>
                <span class="voice-count">共 63 种</span>
            </div>

            <div class="text-row">
                <label for="text" class="label">文本内容</label>
                <textarea id="text" placeholder="输入要合成语音的文字..." rows="4" spellcheck="false"></textarea>
                <div class="char-row">
                    <span id="charCount" class="char-count">0 字</span>
                </div>
            </div>

            <button id="synthesizeButton" class="btn-synth" disabled>
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <span id="btnText">生成音频</span>
                <div id="btnSpinner" class="spinner" style="display:none"></div>
            </button>
        </div>

        <div class="card output-card" id="outputCard" style="display:none">
            <div class="audio-section">
                <div class="audio-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="audio-header-icon">
                        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                    <span>音频预览</span>
                </div>
                <audio id="audioPlayer" controls></audio>
            </div>
            <div class="action-row">
                <button id="downloadButton" class="btn-download">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    下载 WAV
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span>Powered by Azure Cognitive Services · southeastasia · Free F0</span>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
